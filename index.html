<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game Kuis Rumah Sakit</title>
  <style>
    body { 
      font-family: 'Segoe UI', sans-serif; 
      text-align: center; 
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%); 
      color: #0f172a; 
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      transition: background 0.3s;
      touch-action: manipulation;
    }

    body.darurat {
      background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
    }

    h2 {
      color: #0284c7;
      margin: 5px 0;
      font-size: 20px;
    }

    #statusGangguan {
      font-weight: bold;
      height: 22px;
      color: #dc2626;
      margin-bottom: 8px;
      font-size: 13px;
    }

    canvas { 
      background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%); 
      border: 4px solid #0284c7; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.25); 
      display: block; 
      margin: 0 auto 12px auto; 
      max-width: 100%;
    }

    canvas.gempa {
      animation: shake 0.2s infinite;
    }

    @keyframes shake {
      0% { transform: translate(2px, 1px); }
      50% { transform: translate(-2px, -1px); }
      100% { transform: translate(1px, -2px); }
    }

    .mobile-controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 10px auto 15px auto;
      max-width: 300px;
    }

    .btn-arah {
      flex: 1;
      padding: 16px 0;
      font-size: 22px;
      background: linear-gradient(180deg, #0284c7, #0369a1);
      color: white;
      border: none;
      border-radius: 14px;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
      user-select: none;
      -webkit-user-select: none;
    }

    .btn-arah:active {
      transform: scale(0.94);
      background: #075985;
    }

    #quizModal { 
      display: none; 
      background: #ffffff; 
      border: 3px solid #ef4444;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      padding: 20px; 
      width: 280px; 
      margin: 15px auto; 
      border-radius: 12px; 
      color: #1e293b;
    }

    button.aksi { 
      padding: 10px 16px; 
      margin: 5px; 
      cursor: pointer; 
      background: linear-gradient(90deg, #0284c7, #0d9488);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>🏥 Kuis Medis: Hindari Panah!</h2>
  <div id="statusGangguan">Status: Normal (Skor: 0)</div>

  <canvas id="gameCanvas" width="300" height="380"></canvas>

  <!-- Tombol Sentuh Kiri & Kanan untuk HP -->
  <div class="mobile-controls">
    <button class="btn-arah" id="btnKiri">⬅️ KIRI</button>
    <button class="btn-arah" id="btnKanan">KANAN ➡️</button>
  </div>

  <!-- Pop-up Pertanyaan -->
  <div id="quizModal">
    <h3 id="questionText">Pertanyaan di sini</h3>
    <div id="optionsBox"></div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const statusText = document.getElementById("statusGangguan");

    // 1. Bank Soal (Bisa ditambah langsung di dalam kode ini)
    const bankSoal = [
      { tanya: "Ibu kota Indonesia adalah?", benar: "Jakarta", salah: "Bandung" },
      { tanya: "Organ tubuh yang memompa darah adalah?", benar: "Jantung", salah: "Paru-paru" }
    ];

    // 2. Variabel Pemain, Musuh, & Gangguan
    let player = { x: 135, y: 330, size: 30 };
    let enemies = [
      { x: Math.random() * 270, y: 0, size: 28, speed: 3 },
      { x: Math.random() * 270, y: -150, size: 28, speed: 3.5 },
      { x: Math.random() * 270, y: -300, size: 28, speed: 4 }
    ];

    let isGameOver = false;
    let skor = 0;
    let frameCount = 0;

    let kontrolTerbalik = false;
    let modeKabut = false;
    let modeDarurat = false;

    function gerakKiri() {
      if (isGameOver) return;
      if (!kontrolTerbalik) {
        if (player.x > 0) player.x -= 24;
      } else {
        if (player.x < 270) player.x += 24;
      }
    }

    function gerakKanan() {
      if (isGameOver) return;
      if (!kontrolTerbalik) {
        if (player.x < 270) player.x += 24;
      } else {
        if (player.x > 0) player.x -= 24;
      }
    }

    // Kontrol Keyboard Laptop
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") gerakKiri();
      if (e.key === "ArrowRight") gerakKanan();
    });

    // Kontrol Tombol Layar Sentuh HP
    const btnKiri = document.getElementById("btnKiri");
    const btnKanan = document.getElementById("btnKanan");

    btnKiri.addEventListener("touchstart", (e) => { e.preventDefault(); gerakKiri(); });
    btnKiri.addEventListener("click", gerakKiri);

    btnKanan.addEventListener("touchstart", (e) => { e.preventDefault(); gerakKanan(); });
    btnKanan.addEventListener("click", gerakKanan);

    // Kontrol Sentuh Langsung di Layar Game
    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touchX = e.touches[0].clientX - rect.left;
      if (touchX < rect.width / 2) {
        gerakKiri();
      } else {
        gerakKanan();
      }
    });

    // 3. Pengatur Gangguan
    function kelolaGangguan() {
      frameCount++;

      if (frameCount % 400 === 0) {
        const acak = Math.floor(Math.random() * 4);
        kontrolTerbalik = false;
        modeKabut = false;
        modeDarurat = false;
        document.body.classList.remove("darurat");
        canvas.classList.remove("gempa");

        if (acak === 1) {
          kontrolTerbalik = true;
        } else if (acak === 2) {
          modeKabut = true;
        } else if (acak === 3) {
          modeDarurat = true;
          document.body.classList.add("darurat");
          canvas.classList.add("gempa");
        }
      }

      if (kontrolTerbalik) {
        statusText.innerText = `😵 EFEK OBAT: Kontrol Terbalik! (Skor: ${skor})`;
      } else if (modeKabut) {
        statusText.innerText = `🌫️ EFEK BIUS: Pandangan Kabur! (Skor: ${skor})`;
      } else if (modeDarurat) {
        statusText.innerText = `🚨 SIRENE DARURAT: Bergetar! (Skor: ${skor})`;
      } else {
        statusText.innerText = `✅ Status: Normal (Skor: ${skor})`;
      }
    }

    // 4. Loop Utama Game
    function updateGame() {
      if (isGameOver) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      kelolaGangguan();

      // Dekorasi Palang Medis Rumah Sakit
      ctx.fillStyle = "rgba(239, 68, 68, 0.12)";
      ctx.fillRect(135, 140, 30, 90);
      ctx.fillRect(105, 170, 90, 30);

      // Gambar Pemain Bentuk LOVE
      ctx.fillStyle = kontrolTerbalik ? "#9333ea" : "#b46a72";
      const x = player.x, y = player.y, s = player.size;
      ctx.beginPath();
      ctx.moveTo(x + s / 2, y + s * 0.3);
      ctx.bezierCurveTo(x + s / 2, y, x, y, x, y + s * 0.35);
      ctx.bezierCurveTo(x, y + s * 0.65, x + s / 2, y + s * 0.85, x + s / 2, y + s);
      ctx.bezierCurveTo(x + s / 2, y + s * 0.85, x + s, y + s * 0.65, x + s, y + s * 0.35);
      ctx.bezierCurveTo(x + s, y, x + s / 2, y, x + s / 2, y + s * 0.3);
      ctx.fill();

      // Gambar Musuh Panah
      for (let i = 0; i < enemies.length; i++) {
        let enemy = enemies[i];
        enemy.y += enemy.speed;

        if (enemy.y > 380) {
          enemy.y = -40;
          enemy.x = Math.random() * 270;
          skor += 10;
          if (enemy.speed < 7) enemy.speed += 0.15;
        }

        ctx.fillStyle = modeDarurat ? "#dc2626" : "#0369a1";
        const ex = enemy.x, ey = enemy.y, es = enemy.size;
        ctx.beginPath();
        ctx.moveTo(ex + es * 0.35, ey);
        ctx.lineTo(ex + es * 0.65, ey);
        ctx.lineTo(ex + es * 0.65, ey + es * 0.55);
        ctx.lineTo(ex + es, ey + es * 0.55);
        ctx.lineTo(ex + es * 0.5, ey + es);
        ctx.lineTo(ex, ey + es * 0.55);
        ctx.lineTo(ex + es * 0.35, ey + es * 0.55);
        ctx.closePath();
        ctx.fill();

        // Cek Tabrakan
        if (
          player.x < enemy.x + enemy.size - 4 &&
          player.x + player.size - 4 > enemy.x &&
          player.y < enemy.y + enemy.size - 4 &&
          player.y + player.size - 4 > enemy.y
        ) {
          isGameOver = true;
          canvas.classList.remove("gempa");
          tampilkanPertanyaan();
          return;
        }
      }

      // Efek Kabut Bius
      if (modeKabut) {
        ctx.fillStyle = "rgba(148, 163, 184, 0.78)";
        ctx.fillRect(0, 75, 300, 185);
        ctx.fillStyle = "#1e293b";
        ctx.font = "bold 16px sans-serif";
        ctx.fillText("🌫️ KABUT OBAT BIUS 🌫️", 55, 175);
      }

      requestAnimationFrame(updateGame);
    }

    // 5. Kuis Saat Kalah
    function tampilkanPertanyaan() {
      const soalAcak = bankSoal[Math.floor(Math.random() * bankSoal.length)];
      document.getElementById("questionText").innerText = soalAcak.tanya;
      
      const optionsBox = document.getElementById("optionsBox");
      optionsBox.innerHTML = `
        <button class="aksi" onclick="cekJawaban(true)">${soalAcak.benar}</button>
        <button class="aksi" onclick="cekJawaban(false)">${soalAcak.salah}</button>
      `;
      document.getElementById("quizModal").style.display = "block";
    }

    function cekJawaban(isBenar) {
      document.getElementById("quizModal").style.display = "none";
      if (isBenar) {
        alert("Benar! Pasien selamat, lanjutkan permainan!");
        enemies.forEach((e, idx) => e.y = -50 * (idx + 1));
        isGameOver = false;
        updateGame();
      } else {
        alert(`Salah! Game Over. Skor akhir kamu: ${skor}`);
        location.reload();
      }
    }

    updateGame();
  </script>
</body>
</html>
